name: validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type + schema check
        run: npx astro check

      - name: Cross-file content validation
        run: node scripts/validate-content.mjs

      - name: Production build (Astro -> Pagefind -> redirects)
        run: npm run build

      - name: Internal link check
        run: node scripts/check-links.mjs
