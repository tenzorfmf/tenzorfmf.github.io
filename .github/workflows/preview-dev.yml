name: preview-dev

# Keeps the existing Cloudflare Worker Preview named `dev` up to date from the
# `dev` branch. Production is not modified by this workflow.
#
# Required repository secret:
# - CLOUDFLARE_API_TOKEN: Workers Scripts: Edit for the Tenzor account.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-dev
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: preview-dev
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler requires Node >= 22
          cache: npm
      - run: npm ci
      - name: Build (Astro -> Pagefind -> redirects)
        run: npm run build
      - id: preview
        name: Create or update the dev Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --worker-name tenzorfmf-github-io --name dev --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
