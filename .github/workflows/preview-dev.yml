name: preview-dev

# Keeps a Cloudflare Worker Preview of the `dev` branch up to date at
# https://dev-tenzor-fmf.<account-subdomain>.workers.dev (noindex by default).
# Needs repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-dev
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: preview-dev
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler requires Node >= 22
          cache: npm
      - run: npm ci
      - name: Build (Astro -> Pagefind -> redirects)
        run: npm run build
      - id: preview
        name: Create or update the dev Preview
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name dev --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
